# Ephemeral cluster + throwaway Testkube runner per CI run.
#
# Flow: kind cluster -> deploy demo app -> install an independent runner in the
# cluster (floating license) -> run a TestWorkflow targeted at that runner ->
# delete the runner record. The cluster dies with the job; results stay in Testkube.
#
# Runs on GitHub-hosted runners. To compare against faster runners, change only
# `runs-on` (for example to blacksmith-8vcpu-ubuntu-2404).
#
# Required repo secret: TK_API_TOKEN (Testkube API token for the target environment)

name: Ephemeral kind smoke (Testkube)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ephemeral-kind-smoke.yaml

permissions:
  contents: read

env:
  TK_ORG_ID: tkcorg_c6b4dc0ce62fd50a
  TK_ENV_ID: tkcenv_2a833be8f77302c9
  TK_WORKFLOW: ephemeral-kind-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNNER_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ephemeral

      - name: Deploy demo app
        run: |
          kubectl create namespace app
          kubectl -n app create deployment demo-app --image=nginx:1.27
          kubectl -n app expose deployment demo-app --port=80
          kubectl -n app rollout status deployment/demo-app --timeout=120s

      - name: Set up Testkube CLI
        uses: kubeshop/setup-testkube@v1
        with:
          organization: ${{ env.TK_ORG_ID }}
          environment: ${{ env.TK_ENV_ID }}
          token: ${{ secrets.TK_API_TOKEN }}

      - name: Install ephemeral runner
        run: |
          set -o pipefail
          {
            testkube version || true
            testkube install runner "$RUNNER_NAME" --create --floating --namespace testkube
            kubectl -n testkube wait --for=condition=available deployment --all --timeout=180s
            testkube get runners
          } 2>&1 | tee -a "$RUNNER_TEMP/tk.log"

      - name: Run TestWorkflow on the ephemeral runner
        run: |
          testkube run testworkflow "$TK_WORKFLOW" \
            --target name="$RUNNER_NAME" \
            --tag ci-run=${{ github.run_id }} \
            --tag source=github-actions \
            -f 2>&1 | tee -a "$RUNNER_TEMP/tk.log"
        shell: bash -o pipefail {0}

      - name: Surface failure output as annotations
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/tk.log" ] || { echo "::error title=No Testkube log::Failed before the runner step (kind, app deploy, or CLI setup)"; exit 0; }
          msg=$(tail -n 40 "$RUNNER_TEMP/tk.log" | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Testkube step output (last 40 lines)::$msg"

      - name: Remove runner record
        if: always()
        run: testkube delete runner "$RUNNER_NAME" --delete || true
